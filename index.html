<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نهى علي هادي علي | السيرة الذاتية</title>
<meta name="description" content="السيرة الذاتية لنهى علي هادي علي — طالبة بكالوريوس الحاسب وتقنية المعلومات | الذكاء الاصطناعي والابتكار التقني">
<meta property="og:title" content="نهى علي هادي علي | Noha Ali Hadi Ali">
<meta property="og:description" content="الحاسب وتقنية المعلومات · الذكاء الاصطناعي · الابتكار التقني">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%238b5cf6'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='100' height='100' rx='30' fill='url(%23g)'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>N</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060f; --bg2:#100c2b; --surface:rgba(255,255,255,.045); --surface2:rgba(14,11,34,.72);
  --line:rgba(255,255,255,.1); --text:#f5f3ff; --muted:#a9a3cf;
  --v:#8b5cf6; --c:#22d3ee; --p:#f472b6;
  --grad:linear-gradient(110deg,#8b5cf6 0%,#22d3ee 55%,#f472b6 100%);
  --shadow:0 30px 80px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f7f5ff; --bg2:#e9e3ff; --surface:rgba(255,255,255,.72); --surface2:rgba(255,255,255,.85);
  --line:rgba(80,50,160,.14); --text:#1a1440; --muted:#5b5490; --shadow:0 30px 70px rgba(90,60,180,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Outfit',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden;transition:background .5s,color .5s}
html[lang="en"] body{font-family:'Outfit','Cairo',sans-serif;line-height:1.65}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
::selection{background:var(--v);color:#fff}
i[data-ic]{display:inline-flex;width:1.15em;height:1.15em;flex:none}
i[data-ic] svg{width:100%;height:100%}
:focus-visible{outline:2px solid var(--c);outline-offset:3px;border-radius:8px}

/* ---------- ambience ---------- */
.aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;background:radial-gradient(1300px 800px at 50% -15%,var(--bg2),var(--bg))}
.orb{position:absolute;border-radius:50%;filter:blur(110px);animation:drift 22s ease-in-out infinite}
.o1{width:560px;height:560px;background:var(--v);top:-160px;inset-inline-start:-120px;opacity:.5}
.o2{width:520px;height:520px;background:var(--c);bottom:-180px;inset-inline-end:-100px;opacity:.32;animation-delay:-7s}
.o3{width:420px;height:420px;background:var(--p);top:38%;left:42%;opacity:.2;animation-delay:-13s}
[data-theme="light"] .orb{opacity:.28}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(70px,-60px) scale(1.15)}66%{transform:translate(-60px,70px) scale(.9)}}
#glow{position:fixed;left:0;top:0;width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:-2;
  background:radial-gradient(circle,rgba(139,92,246,.2),transparent 62%);will-change:translate}
.noise{position:fixed;inset:0;z-index:200;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:150;background:var(--grad);transform-origin:left;transform:scaleX(0);display:none}
body.entered .progress{display:block}
[dir="rtl"] .progress{transform-origin:right}

/* ---------- controls ---------- */
.controls{position:fixed;top:14px;inset-inline-end:14px;z-index:120;display:flex;gap:8px}
.ctrl{height:44px;min-width:44px;padding:0 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.92rem;transition:.3s}
.ctrl:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 28px rgba(34,211,238,.22)}
.brand{position:fixed;top:14px;inset-inline-start:14px;z-index:120;height:44px;padding:0 16px 0 6px;padding-inline:6px 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);backdrop-filter:blur(18px);display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brand b{width:32px;height:32px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:.95rem}
body.entered .brand{display:none}
@media(max-width:560px){.brand span{display:none}.brand{padding-inline:6px}}

/* ---------- pill nav ---------- */
.pill{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:110;gap:3px;padding:5px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:calc(100vw - 470px);overflow-x:auto;scrollbar-width:none}
.pill::-webkit-scrollbar{display:none}
body.entered .pill{display:flex}
.pill a,.pill button{padding:7px 15px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap;transition:.3s;display:inline-flex;align-items:center;gap:6px}
.pill a:hover,.pill button:hover{color:var(--text);background:var(--surface)}
.pill a.active{color:#fff;background:var(--grad);box-shadow:0 6px 20px rgba(139,92,246,.4)}
@media(max-width:1180px){.pill{top:68px;max-width:calc(100vw - 24px)}}

/* ---------- landing ---------- */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 22px 60px;overflow:hidden}
body.entered #intro{display:none}
#introGlobe{position:absolute;left:50%;top:50%;width:min(115vmin,1000px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.6;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:999px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);font-weight:700;font-size:.9rem;color:var(--c);animation:rise 1s .2s both}
.dotp{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 rgba(34,211,238,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.big-name{position:relative;font-size:clamp(2.7rem,9.5vw,7.2rem);font-weight:900;line-height:1.15;margin:22px 0 14px;letter-spacing:-.02em}
html[lang="en"] .big-name{font-weight:800;line-height:1.05}
.split .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .04em .12em}
.split .w>span{display:inline-block;background:var(--grad);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wordIn 1s cubic-bezier(.2,.9,.2,1) both,shine 8s linear infinite}
@keyframes wordIn{from{transform:translateY(110%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{to{background-position:220% center}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.big-role{max-width:780px;color:var(--muted);font-size:clamp(1rem,2.3vw,1.4rem);font-weight:500;animation:rise 1s .8s both}
.cta{position:relative;overflow:hidden;margin-top:44px;display:inline-flex;align-items:center;gap:14px;padding:19px 42px;border-radius:999px;font-weight:800;font-size:1.15rem;color:#fff;
  background:var(--grad);background-size:200% auto;box-shadow:0 18px 50px rgba(139,92,246,.55);transition:box-shadow .4s,background-position .6s,scale .3s,translate .15s;animation:rise 1s 1s both}
.cta:hover{scale:1.05;background-position:100% 0;box-shadow:0 24px 70px rgba(34,211,238,.5)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-130%);animation:sweep 3.4s 2.2s infinite}
@keyframes sweep{to{transform:translateX(130%)}}
.cta i{animation:nudge 1.5s infinite}
[dir="rtl"] .cta i{transform:scaleX(-1);animation-name:nudgeR}
@keyframes nudge{50%{translate:6px 0}}
@keyframes nudgeR{50%{translate:-6px 0}}
.hint{position:absolute;bottom:26px;color:var(--muted);font-size:.85rem;animation:rise 1s 1.4s both}
.hint::after{content:"";display:block;width:1px;height:34px;margin:10px auto 0;background:linear-gradient(var(--c),transparent);animation:drip 2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- page wipe ---------- */
.wipe{position:fixed;inset:0;z-index:300;pointer-events:none;background:var(--grad);clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .85s cubic-bezier(.7,0,.2,1)}
.wipe.run{clip-path:circle(150vmax at var(--x,50%) var(--y,50%))}
.wipe.out{opacity:0;transition:opacity .6s}

/* ---------- CV layout ---------- */
#cv{display:none}
body.entered #cv{display:block}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
section{padding:90px 0 10px;scroll-margin-top:60px}
.sec-head{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.sec-no{font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:.2em;font-size:.82rem;color:var(--c)}
.sec-title{font-size:clamp(1.8rem,4.6vw,2.9rem);font-weight:900;line-height:1.2}
html[lang="en"] .sec-title{font-weight:700;letter-spacing:-.02em}
.sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
[dir="rtl"] .sec-head::after{background:linear-gradient(270deg,var(--line),transparent)}

.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .45s cubic-bezier(.2,.9,.2,1),border-color .4s,box-shadow .4s}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(139,92,246,.24),transparent 45%)}
.card:hover{transform:translateY(-6px);border-color:rgba(139,92,246,.55);box-shadow:var(--shadow)}
.card:hover::before{opacity:1}
.card>*{position:relative}

.hero{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding-top:130px;padding-bottom:30px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:7px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.85rem;color:var(--c)}
.hero h1{font-size:clamp(2.5rem,6.2vw,4.9rem);font-weight:900;line-height:1.18;margin:20px 0 12px;letter-spacing:-.02em}
html[lang="en"] .hero h1{font-weight:800;line-height:1.05}
.hero .role{color:var(--muted);font-size:clamp(1rem,1.9vw,1.25rem);max-width:560px}
.typed-line{margin-top:18px;font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:800;min-height:2.2em;display:flex;align-items:center;gap:10px}
.typed-line .lead{color:var(--muted);font-weight:600}
#typed{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.caret{width:3px;height:1.3em;background:var(--c);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;font-weight:800;border:1px solid var(--line);background:var(--surface);transition:.35s;backdrop-filter:blur(12px)}
.btn:hover{transform:translateY(-4px);border-color:var(--c)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 14px 36px rgba(139,92,246,.45)}
.btn.primary:hover{box-shadow:0 18px 46px rgba(34,211,238,.4)}

.hero-visual{position:relative;width:min(100%,470px);aspect-ratio:1;margin:auto}
#heroGlobe{position:absolute;inset:0;width:100%;height:100%}
.mono{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(4rem,11vw,7rem);font-weight:900;color:var(--text);opacity:.12;pointer-events:none;font-family:'Cairo','Outfit',sans-serif}
.chip3d{position:absolute;padding:8px 16px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);backdrop-filter:blur(14px);font-weight:800;font-size:.82rem;display:flex;gap:8px;align-items:center;animation:bob 6s ease-in-out infinite}
.chip3d i{color:var(--c)}
.chip3d.a{top:6%;inset-inline-start:0}.chip3d.b{top:22%;inset-inline-end:-2%;animation-delay:-1.5s}
.chip3d.c{bottom:20%;inset-inline-start:-3%;animation-delay:-3s}.chip3d.d{bottom:4%;inset-inline-end:8%;animation-delay:-4.5s}
@keyframes bob{50%{transform:translateY(-14px)}}

.marquee{margin-top:60px;overflow:hidden;direction:ltr;border-block:1px solid var(--line);padding:18px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:46px;width:max-content;animation:scroll 32s linear infinite}
.track span{font-family:'Outfit',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px var(--muted);display:flex;align-items:center;gap:46px;white-space:nowrap}
.track span::after{content:"✦";color:var(--v);-webkit-text-stroke:0;font-size:1rem}
@keyframes scroll{to{transform:translateX(-50%)}}
.marquee:hover .track{animation-play-state:paused}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.about-main{grid-column:span 7;padding:36px}
.about-main p{font-size:1.12rem}
.about-main p+p{margin-top:16px;color:var(--muted)}
.about-main .qm{font-size:4rem;line-height:.6;color:var(--v);font-family:Georgia,serif;opacity:.7;display:block;margin-bottom:8px}
.stats{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stat{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px 10px}
.stat b{font-family:'Outfit',sans-serif;font-size:clamp(2.2rem,5vw,3.2rem);font-weight:800;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-weight:700;font-size:.9rem}

.edu{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:34px}
.edu .badge{width:84px;height:84px;border-radius:26px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:2.2rem;box-shadow:0 16px 40px rgba(139,92,246,.5);flex:none}
.edu .txt{flex:1;min-width:240px}
.edu h3{font-size:clamp(1.3rem,2.8vw,1.8rem);font-weight:900;line-height:1.35}
.edu .deg{color:var(--c);font-weight:700;font-size:1.1rem;margin-top:4px}
.edu .yrs{padding:9px 22px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-family:'Outfit',sans-serif;font-weight:700;letter-spacing:.04em}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.tile{display:flex;align-items:center;gap:16px;padding:22px}
.ico{flex:none;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:1.5rem;color:#fff;background:var(--grad);box-shadow:0 10px 26px rgba(139,92,246,.4)}
.tile:nth-child(3n+2) .ico{background:linear-gradient(135deg,#22d3ee,#8b5cf6)}
.tile:nth-child(3n) .ico{background:linear-gradient(135deg,#f472b6,#8b5cf6)}
.tile h3{font-size:1.05rem;font-weight:800;line-height:1.5}

.courses{display:flex;flex-direction:column;gap:12px}
.course{display:flex;align-items:center;gap:20px;padding:20px 26px}
.course .n{font-family:'Outfit',sans-serif;font-weight:800;font-size:2rem;line-height:1;min-width:58px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.course h3{flex:1;font-size:1.05rem;font-weight:700}
.course i{color:var(--muted);transition:.3s}
[dir="rtl"] .course i{transform:scaleX(-1)}
.course:hover i{color:var(--c);translate:6px 0}
[dir="rtl"] .course:hover i{translate:-6px 0}

.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.lang{display:flex;align-items:center;gap:24px;padding:28px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%}
.ring-bg{stroke:var(--line)}
.ring-fg{stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1) .35s;stroke-linecap:round}
.in .ring-fg{stroke-dashoffset:var(--off)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:800}
.lang h3{font-size:1.5rem;font-weight:900}
.lang p{color:var(--muted);font-weight:600}
.scale{display:flex;gap:4px;margin-top:8px;direction:ltr}
.scale s{width:22px;height:5px;border-radius:3px;background:var(--line);text-decoration:none}
.scale s.on{background:var(--grad)}

.contact{padding:clamp(28px,5vw,56px);text-align:center;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.1) 55%,rgba(244,114,182,.12)),var(--surface)}
.contact h3{font-size:clamp(1.8rem,5vw,3.2rem);font-weight:900;line-height:1.25}
.contact>p{color:var(--muted);margin-top:6px}
.mail-big{display:inline-block;margin:26px 0 8px;font-family:'Outfit',sans-serif;font-weight:700;font-size:clamp(1.05rem,3.4vw,2rem);word-break:break-all;direction:ltr;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;transition:.3s}
.mail-big:hover{filter:brightness(1.2)}
.contact .actions{justify-content:center}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:30px;text-align:start}
.info .it{display:flex;gap:14px;align-items:center;padding:16px 20px;border-radius:20px;background:var(--surface2);border:1px solid var(--line)}
.info .it .ico{width:44px;height:44px;border-radius:14px;font-size:1.2rem}
.info small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.info strong{font-weight:800;direction:ltr;unicode-bidi:plaintext;display:block}
.info .it.rtlv strong{direction:inherit}

footer{text-align:center;color:var(--muted);padding:70px 20px 50px;font-size:.9rem}
footer .actions{justify-content:center;margin:0 0 22px}

.reveal{opacity:0;transform:translateY(44px);transition:opacity .9s cubic-bezier(.2,.9,.2,1),transform .9s cubic-bezier(.2,.9,.2,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;text-align:center;min-height:auto;padding-top:150px}
  .hero .role{margin-inline:auto}.typed-line,.actions{justify-content:center}
  .hero-visual{order:-1;width:min(86%,340px)}
  .about-main,.stats{grid-column:span 12}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}.split .w>span{opacity:1}}

/* ---------- print (Download PDF) ---------- */
@media print{
  .aurora,#glow,.noise,.progress,.controls,.pill,.brand,#intro,.wipe,.hero-visual,.marquee,.actions,footer .actions,.hint{display:none!important}
  body{background:#fff;color:#111}#cv{display:block!important}
  .card,.info .it{background:#fff!important;border:1px solid #ccc!important;box-shadow:none!important;backdrop-filter:none!important;break-inside:avoid}
  .reveal{opacity:1!important;transform:none!important}
  section{padding-top:28px}.hero{min-height:auto;padding-top:10px;display:block}
  .hero h1,.stat b,#typed,.course .n,.mail-big{-webkit-text-fill-color:#111;background:none!important;color:#111}
  .ico,.edu .badge{background:#eee!important;color:#111!important;box-shadow:none!important}
  .role,.about-main p+p,.stat span{color:#444!important}
}
</style>
</head>
<body>

<div class="aurora"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="glow"></div>

function splitWords(el, text){
  el.setAttribute('aria-label', text);

function render(){

/* typewriter */
let tTimer, tI = 0, tC = 0, tDel = false;
function restartTyping(){
  clearTimeout(tTimer); tI = 0; tC = 0; tDel = false;
  const el = $('#typed'); const arr = T[lang].typed;
  if (reduce){ el.textContent = arr[0]; return; }
  (function step(){
    const s = arr[tI % arr.length];
    tC += tDel ? -1 : 1;
    el.textContent = s.slice(0, tC);
    let d = tDel ? 38 : 85;
    if (!tDel && tC === s.length){ tDel = true; d = 1500; }
    else if (tDel && tC === 0){ tDel = false; tI++; d = 350; }
    tTimer = setTimeout(step, d);
  })();
}

    wipe.style.transition = 'none';
    wipe.classList.remove('run','out'); void wipe.offsetWidth; wipe.style.transition = '';
  }, 1550);
}
function showCV(){
  document.body.classList.add('entered'); scrollTo(0,0);
  observeReveal(); onScroll();
  try{ history.replaceState(null,'','#home'); }catch(e){}
}
function showIntro(){
  document.body.classList.remove('entered'); scrollTo(0,0);
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
}
const enterBtn = $('#enterBtn');
enterBtn.onclick = () => { const r = enterBtn.getBoundingClientRect(); runWipe(r.left + r.width/2, r.top + r.height/2, showCV); };
$('#homeBtn').onclick = () => runWipe(innerWidth/2, 40, showIntro);
$('#backBtn').onclick = () => { const r = $('#backBtn').getBoundingClientRect(); runWipe(r.left + r.width/2, r.top + r.height/2, showIntro); };
addEventListener('keydown', e => { if (e.key === 'Enter' && !document.body.classList.contains('entered') && document.activeElement === document.body) enterBtn.click(); });
/* magnetic CTA */
enterBtn.addEventListener('pointermove', e => { const r = enterBtn.getBoundingClientRect(); enterBtn.style.translate = `${(e.clientX-r.left-r.width/2)*.22}px ${(e.clientY-r.top-r.height/2)*.35}px`; });
enterBtn.addEventListener('pointerleave', () => { enterBtn.style.translate = ''; });

/* =============================================================
   Pointer effects, scroll, reveal, counters
   ============================================================= */
const mouse = {x:0,y:0}; const glow = $('#glow');
addEventListener('pointermove', e => {
  mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1;
  glow.style.translate = `${e.clientX-280}px ${e.clientY-280}px`;
  const c = e.target.closest && e.target.closest('.card');
  if (c){ const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX-r.left)+'px'); c.style.setProperty('--my', (e.clientY-r.top)+'px'); }
}, {passive:true});

let io, cio;
function observeReveal(){
  if (!io){
    io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12});
    cio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ count(e.target); cio.unobserve(e.target); } }), {threshold:.6});
  }
  document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
  document.querySelectorAll('[data-count]').forEach(el => { if (!el.dataset.done) cio.observe(el); });
}
function count(el){
  el.dataset.done = 1; const target = +el.dataset.count, t0 = performance.now(), dur = 1700;
  if (reduce){ el.textContent = target; return; }
  (function tick(n){ const p = Math.min((n-t0)/dur,1); el.textContent = Math.round(target*(1-Math.pow(1-p,3))); if (p<1) requestAnimationFrame(tick); })(t0);
}
const navLinks = [...document.querySelectorAll('#nav a')]; const bar = $('#progress');
function onScroll(){
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`;
  let cur = '';
  document.querySelectorAll('#cv section').forEach(s => { if (scrollY >= s.offsetTop - 200) cur = s.id; });
  navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + cur));
}
addEventListener('scroll', onScroll, {passive:true});

/* =============================================================
   3D particle globe
   ============================================================= */
function Globe(canvas, opts){
  const ctx = canvas.getContext('2d'), N = opts.n || 150, pts = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++){ const y = 1 - (i/(N-1))*2, r = Math.sqrt(1-y*y), a = ga*i; pts.push([Math.cos(a)*r, y, Math.sin(a)*r]); }
  const pairs = [];
  for (let i = 0; i < N; i++) for (let j = i+1; j < N; j++){
    const d = Math.hypot(pts[i][0]-pts[j][0], pts[i][1]-pts[j][1], pts[i][2]-pts[j][2]);
    if (d < (opts.link || .4)) pairs.push([i,j]);
  }
  let rot = Math.random()*6, tilt = 0, w = 0, h = 0;
  function size(){ const d = Math.min(devicePixelRatio||1,2); w = canvas.clientWidth; h = canvas.clientHeight; canvas.width = w*d; canvas.height = h*d; ctx.setTransform(d,0,0,d,0,0); }
  const proj = new Array(N);
  function draw(){
    ctx.clearRect(0,0,w,h);
    const dark = root.dataset.theme === 'dark';
    const A = dark ? '167,139,250' : '109,40,217', B = dark ? '34,211,238' : '8,145,178';
    const R = Math.min(w,h) * .36, cx = w/2, cy = h/2;
    tilt += (mouse.y * .5 - tilt) * .04;
    if (!reduce) rot += .0035 + mouse.x * .0025;
    const cr = Math.cos(rot), sr = Math.sin(rot), ct = Math.cos(tilt), st = Math.sin(tilt);
    for (let i = 0; i < N; i++){
      const p = pts[i];
      const x1 = p[0]*cr + p[2]*sr, z1 = -p[0]*sr + p[2]*cr;
      const y2 = p[1]*ct - z1*st, z2 = p[1]*st + z1*ct;
      const s = 3 / (3 - z2);
      proj[i] = [cx + x1*R*s, cy + y2*R*s, z2];
    }
    ctx.lineWidth = 1;
    for (const [i,j] of pairs){
      const a = proj[i], b = proj[j], dpt = (a[2]+b[2])/2;
      const al = Math.max(0, (dpt+1)/2) * .42;
      ctx.strokeStyle = `rgba(${(i+j)%7 === 0 ? B : A},${al.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
    for (let i = 0; i < N; i++){
      const p = proj[i], al = .25 + (p[2]+1)/2 * .75;
      ctx.fillStyle = `rgba(${i % 6 === 0 ? B : A},${al.toFixed(2)})`;
      ctx.beginPath(); ctx.arc(p[0], p[1], (i % 6 === 0 ? 2.6 : 1.7) * (.6 + (p[2]+1)/2*.7), 0, 6.283); ctx.fill();
    }
  }
  (function frame(){
    if (canvas.clientWidth){ if (canvas.clientWidth !== w || canvas.clientHeight !== h) size(); draw(); }
    requestAnimationFrame(frame);
  })();
}
Globe($('#introGlobe'), {n:190, link:.36});
Globe($('#heroGlobe'), {n:150, link:.4});
